modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

# Present for tooling and launchers. NeoForge loads this jar as a ModLauncher service and leaves
# it out of mod scanning, so Linkwright never appears in the mod list and never has to match
# between client and server.

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Dependency reducer and link patcher. When a mod asks for a different version of another mod, Linkwright checks the actual code links between them, lets the game launch when they line up, and patches calls to methods that changed signature.
'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"
