plugins {
    id 'base'
}

// The root project only aggregates. Everything buildable lives in ports/<name>.
//
// Linkwright never touches a Minecraft class at compile time, so there is no ForgeGradle, Loom or
// ModDevGradle here: each port compiles the shared core plus the hooks for its loaders against
// those loaders' own APIs. `ports/universal` is one jar for every modern loader; the other ports
// exist only because older loaders expose different interfaces.

def portProjects = subprojects.findAll { it.parent != null && it.parent.name == 'ports' }

configure(portProjects) {
    apply plugin: 'java'

    group = mod_group_id
    // The jar is named after what it serves: a loader (jar_label), a Minecraft range, or nothing
    // for the universal jar, which leaves minecraft_version blank.
    def label = project.findProperty('jar_label') ?: minecraft_version
    version = label ? "${label}-${mod_version}" : mod_version

    base {
        archivesName = mod_id
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_toolchain as int)
    }

    repositories {
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
            metadataSources {
                mavenPom()
                artifact()
            }
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
            content { includeGroup 'net.fabricmc' }
        }
        maven {
            name = 'Mojang'
            url = 'https://libraries.minecraft.net/'
            content { includeModule 'net.minecraft', 'launchwrapper' }
        }
    }

    // `platform` names the loader-specific source trees this port needs, in order, on top of the
    // shared core.
    def platformDirs = platform.split(',')*.trim().findAll { it }

    sourceSets.main.java.srcDirs = [rootProject.file('common/src/main/java')] +
            platformDirs.collect { rootProject.file("platform/${it}/src/main/java") } +
            [file('src/main/java')]
    sourceSets.main.resources.srcDirs = [rootProject.file('common/src/main/resources')] +
            platformDirs.collect { rootProject.file("platform/${it}/src/main/resources") } +
            [file('src/main/resources')]
    sourceSets.test.java.srcDirs = [file('src/test/java')]

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:-options'
    }
    tasks.named('compileJava', JavaCompile).configure {
        options.release = java_release as int
        dependsOn ':common:compileJava'
    }

    tasks.named('processResources', ProcessResources).configure {
        def replaceProperties = [
                mod_id       : mod_id,
                mod_name     : mod_name,
                mod_version  : mod_version,
                mod_license  : mod_license,
                mod_authors  : mod_authors,
                mod_description: mod_description,
        ]
        inputs.properties replaceProperties
        filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'fabric.mod.json',
                       'quilt.mod.json', 'mcmod.info']) {
            expand replaceProperties
        }
    }

    tasks.named('jar', Jar).configure {
        from(rootProject.file('LICENSE'))
        manifest {
            def attrs = [
                    'Implementation-Title'  : mod_name,
                    'Implementation-Version': mod_version,
                    'Implementation-Vendor' : mod_authors,
                    // Pins the module name so ModLauncher does not derive one from the file name.
                    'Automatic-Module-Name' : mod_id,
            ]
            if (project.hasProperty('coremod_class')) {
                attrs['FMLCorePlugin'] = coremod_class
                attrs['FMLCorePluginContainsFMLMod'] = 'false'
            }
            if (project.hasProperty('tweak_class')) {
                attrs['TweakClass'] = tweak_class
            }
            if (project.hasProperty('agent_class')) {
                attrs['Premain-Class'] = agent_class
                attrs['Launcher-Agent-Class'] = agent_class
            }
            attributes(attrs)
        }
    }

    tasks.named('test', Test).configure {
        useJUnitPlatform()
        maxHeapSize = '1G'
        // Point at a real instance to run the pack scan test: -Plinkwright.testGameDir=...
        if (project.hasProperty('linkwright.testGameDir')) {
            systemProperty 'linkwright.testGameDir', project.property('linkwright.testGameDir')
        }
        testLogging { showStandardStreams = true; exceptionFormat = 'full' }
    }

    tasks.register('collectJar', Copy) {
        dependsOn tasks.named('jar')
        from tasks.named('jar')
        into rootProject.layout.buildDirectory.dir('libs')
    }
}

// `gradlew release` puts every port's jar in build/libs at the repo root.
tasks.register('release') {
    group = 'build'
    description = 'Builds every port and collects the jars into build/libs.'
    dependsOn portProjects.collect { it.tasks.named('collectJar') }
}
