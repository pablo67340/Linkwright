plugins {
    id 'java'
}

group = 'com.linkwright'
version = project.mod_version
base.archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
}

// Everything here is already on NeoForge 1.21.1's boot or service layer at runtime,
// matching the versions the 21.1.x installer ships.
dependencies {
    compileOnly 'cpw.mods:modlauncher:11.0.5'
    compileOnly 'cpw.mods:securejarhandler:3.0.8'
    compileOnly 'net.sf.jopt-simple:jopt-simple:5.0.4'
    compileOnly 'org.ow2.asm:asm:9.7'
    compileOnly 'org.ow2.asm:asm-tree:9.7'
    compileOnly 'com.electronwill.night-config:core:3.7.4'
    compileOnly 'com.electronwill.night-config:toml:3.7.4'
    compileOnly 'org.apache.maven:maven-artifact:3.9.9'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.22.1'

    testImplementation 'org.ow2.asm:asm:9.7'
    testImplementation 'org.ow2.asm:asm-tree:9.7'
    testImplementation 'com.electronwill.night-config:core:3.7.4'
    testImplementation 'com.electronwill.night-config:toml:3.7.4'
    testImplementation 'org.apache.maven:maven-artifact:3.9.9'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.22.1'
    testImplementation 'cpw.mods:modlauncher:11.0.5'
    testImplementation 'cpw.mods:securejarhandler:3.0.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.22.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def props = [mod_id: project.mod_id, mod_name: project.mod_name, mod_version: project.mod_version,
                 mod_license: project.mod_license, mod_authors: project.mod_authors]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

jar {
    from('LICENSE')
    manifest.attributes(
            'Implementation-Title': project.mod_name,
            'Implementation-Version': project.mod_version,
            'Automatic-Module-Name': 'linkwright'
    )
}

test {
    useJUnitPlatform()
    maxHeapSize = '1G'
    // Point at a real mods folder to run the pack scan test: -Plinkwright.testGameDir=...
    if (project.hasProperty('linkwright.testGameDir')) {
        systemProperty 'linkwright.testGameDir', project.property('linkwright.testGameDir')
    }
    testLogging { showStandardStreams = true; exceptionFormat = 'full' }
}
