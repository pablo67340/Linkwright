# Linkwright for Forge 1.7.10 to 1.12.2, which start through LaunchWrapper on Java 8.
#
#   Manifest TweakClass -> LinkwrightTweaker, which FML adds ahead of its own startup steps
#   LinkwrightTransformer hooks Loader.sortModList and applies approved patches

minecraft_version=1.7.10-1.12.2

java_toolchain=17
java_release=8

# Loader-specific source trees, applied in order on top of common/.
platform=legacy

tweak_class=com.linkwright.legacy.LinkwrightTweaker
