# Linkwright for Fabric Loader 0.14 and later, which covers every Minecraft version Fabric runs
# (1.14 and up, on Java 8 before 1.17).
#
#   Premain-Class -> LinkwrightAgent, started by -javaagent:mods/linkwright-fabric-<version>.jar
#   The agent hooks Fabric Loader's DependencyOverrides and patches mod classes as they load
#   fabric.mod.json -> AgentCheck, which warns when the jar is installed without the agent

# Blank: one jar for every Minecraft version Fabric supports.
minecraft_version=
jar_label=fabric

java_toolchain=17
java_release=8

# Loader-specific source trees, applied in order on top of common/.
platform=fabric

agent_class=com.linkwright.fabric.LinkwrightAgent
