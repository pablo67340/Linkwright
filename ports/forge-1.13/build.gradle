// Shared build logic is in the root build.gradle; settings for this port are in gradle.properties.

dependencies {
    // Compiled against ModLauncher 8; the parts used here are unchanged since ModLauncher 2.
    compileOnly 'cpw.mods:modlauncher:8.1.3'
    // The mod locator interface as Forge 1.14 to 1.16 have it.
    compileOnly('net.minecraftforge:forgespi:3.2.0') { transitive = false }
    // Only for the @Mod annotation.
    compileOnly('net.minecraftforge:forge:1.16.5-36.2.42:universal') { transitive = false }
    compileOnly 'org.apache.commons:commons-lang3:3.8.1'
    compileOnly 'net.sf.jopt-simple:jopt-simple:5.0.4'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.ow2.asm:asm-tree:7.2'
    compileOnly 'org.apache.maven:maven-artifact:3.6.0'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.11.2'
}
