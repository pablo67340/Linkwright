# Linkwright for Forge 1.13 to 1.16.5 (ModLauncher 2 to 8), which run on Java 8.
#
#   META-INF/services ITransformationService -> LinkwrightService
#   Forge 1.14+: the service also registers this jar as a mod locator (LinkwrightLocator), which
#   offers the jar to FML as the mod "linkwright"

minecraft_version=1.13-1.16.5

java_toolchain=17
java_release=8

# Loader-specific source trees, applied in order on top of common/.
platform=maven,fml,forge,oldml
