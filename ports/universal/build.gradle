// Shared build logic is in the root build.gradle; settings for this port are in gradle.properties.

// ModLauncher 11 is published for Java 21 but only its API is compiled against here.
java {
    disableAutoTargetJvm()
}

dependencies {
    // Compiled against ModLauncher 11; everything used here exists unchanged in 9 and 10 except
    // ITransformer.getTargetType(), which only 11 calls.
    compileOnly 'cpw.mods:modlauncher:11.0.5'
    compileOnly 'cpw.mods:securejarhandler:2.1.10'
    compileOnly 'net.sf.jopt-simple:jopt-simple:5.0.4'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'org.ow2.asm:asm-tree:9.7'
    compileOnly 'org.apache.maven:maven-artifact:3.8.5'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.17.0'

    testImplementation 'org.ow2.asm:asm-tree:9.7'
    testImplementation 'org.apache.maven:maven-artifact:3.8.5'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.17.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.17.0'
}

tasks.named('compileTestJava', JavaCompile).configure {
    options.release = 21
}
