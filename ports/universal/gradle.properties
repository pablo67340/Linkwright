# Linkwright for every modern loader in one jar.
#
# Nothing in the jar is tied to a Minecraft version; each loader finds its own hook:
#   Forge 1.17+ / NeoForge 20.2-21.8 (ModLauncher 9-11)  META-INF/services ITransformationService -> LinkwrightService
#   NeoForge 21.9+ (FML 10+, no ModLauncher)              META-INF/services IModFileCandidateLocator -> LinkwrightLocator,
#                                                         ClassProcessor -> BridgeProcessor

# Blank: detected at runtime. Also drops the version from the jar name.
minecraft_version=

# Forge 1.17.1 is the oldest loader this jar serves, and it runs on Java 16.
java_toolchain=21
java_release=16

# Loader-specific source trees, applied in order on top of common/.
platform=maven,fml,modlauncher,neoforge,forge,fmlstartup
